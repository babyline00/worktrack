name: worktrack
description: WorkTrack — Workforce attendance & project monitoring mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  camera: ^0.10.5+9
  geolocator: ^10.1.0
  image_picker: ^1.0.7
  provider: ^6.1.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.2.0
  path_provider: ^2.1.2
  cached_network_image: ^3.3.1
  pull_to_refresh: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

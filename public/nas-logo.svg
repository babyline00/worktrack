<?xml version="1.0" encoding="UTF-8"?>
<!--
  NAS International — full lockup (mark + wordmark + tagline).

  Hand-authored recreation of the supplied NAS International logo, built from
  the artwork's own colours. Not a traced copy of the original file — replace
  with the official asset when it is available.

  Use this where there is room for the whole identity (login page, splash,
  printed reports). Where only the monogram fits — favicon, app icon, avatar,
  compact sidebar header — use nas-mark.svg instead.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" width="620" height="170"
     role="img" aria-label="NAS International — Delivering Today, Connecting Tomorrow">
  <title>NAS International</title>
  <defs>
    <linearGradient id="nas-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5BB4A"/>
      <stop offset="100%" stop-color="#C88A2A"/>
    </linearGradient>
    <linearGradient id="nas-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B5E3F"/>
      <stop offset="100%" stop-color="#0E3B28"/>
    </linearGradient>
    <clipPath id="nas-lockup-sq">
      <rect x="0" y="0" width="160" height="160" rx="30"/>
    </clipPath>
  </defs>

  <!-- ============ mark ============ -->
  <g transform="translate(0 15) scale(0.875)">
    <g clip-path="url(#nas-lockup-sq)">
      <rect width="160" height="160" fill="url(#nas-green)"/>
      <path d="M18 128 C 54 114, 108 113, 143 130"
            fill="none" stroke="#F2B441" stroke-width="4.5"
            stroke-linecap="round" opacity="0.55"/>
    </g>
    <g transform="translate(80 80) skewX(-8) translate(-80 -80)"
       fill="none" stroke-linecap="butt" stroke-linejoin="miter">
      <path d="M22 108 L22 52 L52 108 L52 52" stroke="#FFFFFF" stroke-width="14"/>
      <path d="M64 108 L80 52 L96 108" stroke="url(#nas-gold)" stroke-width="14"/>
      <path d="M70.5 86 L89.5 86" stroke="url(#nas-gold)" stroke-width="9"/>
      <path d="M140 64 C136 55 128 50 120 51 C109 53 106 63 114 71
               C121 78 133 80 137 89 C142 99 135 109 124 109
               C115 109 109 105 106 99"
            stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ============ wordmark ============ -->
  <!-- textLength pins the wordmark to an exact width, so it stays aligned with
       the mark no matter which font the viewer substitutes. Without it the
       line length would drift with the available font metrics. -->
  <text x="172" y="80"
        textLength="430" lengthAdjust="spacingAndGlyphs"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="42" font-weight="800"
        fill="#0E3B28">NAS INTERNATIONAL</text>

  <!-- Tagline. Kept as one <text> with tspans so the phrase and the bullet are
       never positioned by hand — separate x values were how the two halves
       collided before. -->
  <text x="172" y="122"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="15" font-weight="600" letter-spacing="2.2"
        fill="#1F3A33"><tspan>— DELIVERING TODAY</tspan><tspan fill="#C88A2A">  •  </tspan><tspan>CONNECTING TOMORROW —</tspan></text>
</svg>
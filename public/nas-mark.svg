<?xml version="1.0" encoding="UTF-8"?>
<!--
  NAS International — brand mark (monogram only).

  Hand-authored recreation of the supplied NAS International logo, built from
  the artwork's own colours so it stays crisp at favicon size. Not a traced copy
  of the original file — replace with the official asset when it is available.

  viewBox 0 0 160 160, square, for favicon / app-icon / avatar use.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160"
     role="img" aria-label="NAS International">
  <title>NAS International</title>
  <defs>
    <!-- The gold in the logo runs from a light amber at the top to a deeper
         bronze at the bottom. -->
    <linearGradient id="nas-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5BB4A"/>
      <stop offset="100%" stop-color="#C88A2A"/>
    </linearGradient>
    <linearGradient id="nas-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B5E3F"/>
      <stop offset="100%" stop-color="#0E3B28"/>
    </linearGradient>
    <clipPath id="nas-sq">
      <rect x="0" y="0" width="160" height="160" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#nas-sq)">
    <rect width="160" height="160" fill="url(#nas-rim)"/>

    <!-- The gold arc that sweeps through the logo. Kept below the letters and
         quiet so the monogram stays the thing you read at 16px. -->
    <path d="M18 128 C 54 114, 108 113, 143 130"
          fill="none" stroke="#F2B441" stroke-width="4.5"
          stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Monogram drawn as strokes so the weight stays even at any size. The
       forward lean is a skew rather than slanted letterforms, which keeps that
       weight consistent. Cap height runs y 52..108, centred in the box. -->
  <g transform="translate(80 80) skewX(-8) translate(-80 -80)"
     fill="none" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- N -->
    <path d="M22 108 L22 52 L52 108 L52 52" stroke="#FFFFFF" stroke-width="14"/>
    <!-- A — gold, with a crossbar so it reads as a letter and not a peak -->
    <path d="M64 108 L80 52 L96 108" stroke="url(#nas-gold)" stroke-width="14"/>
    <path d="M70.5 86 L89.5 86" stroke="url(#nas-gold)" stroke-width="9"/>
    <!-- S -->
    <path d="M140 64 C136 55 128 50 120 51 C109 53 106 63 114 71
             C121 78 133 80 137 89 C142 99 135 109 124 109
             C115 109 109 105 106 99"
          stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>